# Access github.com via a personal access token to avoid rate limiting on unauthenticated clones.
workflow:
  rules:
    - if: $GH_TOKEN
      variables:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: "url.https://oauth2:${GH_TOKEN}@github.com/.insteadOf"
        GIT_CONFIG_VALUE_0: "https://github.com/"
    - when: always

stages:
  - build
  - pip

push_github:
  stage: build
  tags:
    - linux
    - bash
  script:
    - git remote add github git@github.com:NGSolve/netgen.git || true
    - git remote update
    - git checkout --track origin/master
    - git pull origin master
    - git push github master --tags
  only:
    - master

############################################
# Windows
############################################
.template_windows:
  stage: build
  tags:
    - windows
    - pip
  variables:
    BUILD_TYPE: Release
  before_script:
    - |
        $ErrorActionPreference = "Stop"

        # Import MSVC environment from vcvars64.bat into the current PowerShell process
        $vcvars = '"C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"'
        cmd /c "$vcvars && set" |
          ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') {
              [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2])
              Set-Item -Path "env:$($matches[1])" -Value $matches[2] -ErrorAction SilentlyContinue
            }
          }

        $env:CCACHE_DIR       = "C:\tools\cache"
        $env:CCACHE_BASEDIR   = $env:CI_PROJECT_DIR
        $env:NETGEN_BUILD_DIR = Join-Path $env:CI_PROJECT_DIR "build"
        $env:INSTALL_DIR      = Join-Path $env:CI_PROJECT_DIR "netgen_install"
        $env:NETGENDIR        = Join-Path $env:INSTALL_DIR "bin"
        $env:PYTHONPATH       = Join-Path $env:INSTALL_DIR "lib\site-packages"

        Write-Output $env:PATH
        $env:PATH = @(
          (Join-Path $env:INSTALL_DIR "bin")
          "C:\python314"
          "C:\python314\bin"
          "C:\python314\Scripts"
          "C:\tools"
          $env:PATH
        ) -join ";"
        Write-Output $env:PATH

        $env:CCACHE_HARDLINK  = "1"
        $env:CCACHE_NOHASHDIR = "1"

        & "C:\tools\ccache.exe" -s
        & "C:\tools\ccache.exe" -M "20G"

        python.exe --version
        cmake --version

        New-Item -ItemType Directory -Force -Path $env:INSTALL_DIR | Out-Null

.build_windows:
  script:
    - |
        python.exe -m pip install -U netgen-occt netgen-occt-devel ninja cmake pytest-check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git submodule update --init --recursive
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        New-Item -ItemType Directory -Force -Path $env:NETGEN_BUILD_DIR | Out-Null
        Set-Location $env:NETGEN_BUILD_DIR

        cmake $env:CI_PROJECT_DIR `
          -G Ninja `
          -DCMAKE_PREFIX=C:/python314 `
          -DPython3_ROOT_DIR=C:/python314 `
          -DCMAKE_INSTALL_PREFIX="$($env:INSTALL_DIR)" `
          -DCHECK_RANGE=ON `
          -DUSE_CGNS=OFF `
          -DUSE_OCC=ON `
          -DUSE_CCACHE=ON `
          -DENABLE_UNIT_TESTS=ON `
          -DCMAKE_BUILD_TYPE="$($env:BUILD_TYPE)"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        cmake --build . --target install --config "$($env:BUILD_TYPE)"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

.test_windows:
  script:
    - |
        Set-Location (Join-Path $env:NETGEN_BUILD_DIR "netgen")
        ctest -C "$($env:BUILD_TYPE)" -V --output-on-failure
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

windows:
  extends: .template_windows
  script:
    - !reference [.build_windows, script]
    - !reference [.test_windows, script]

windows_debug:
  extends: .template_windows
  variables:
    BUILD_TYPE: Debug
  script:
    - !reference [.build_windows, script]
    - !reference [.test_windows, script]

generate_results:
  extends: .template_windows
  when: manual
  script:
    - !reference [.build_windows, script]
    - |
        Set-Location (Join-Path $env:CI_PROJECT_DIR "tests\pytest")
        python test_tutorials.py "new_results.json"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    paths:
      - tests/pytest/new_results.json
    when: always
    expire_in: 1 week

############################################
# Ubuntu/Linux
############################################

# Build the CI image once per pipeline on the shell runner, the docker executor
# picks it up locally (needs pull_policy "if-not-present" in the runner config).
build_image:
  stage: build
  tags:
    - linux
    - bash
  script:
    - docker build -t netgen_ci:24.04 -f tests/dockerfile tests
    - docker image prune -f

.template_ubuntu:
  image:
    name: netgen_ci:24.04
    pull_policy: if-not-present
  # docker executor runner, must run on the same host as the shell runner building the image
  tags:
    - linux
    - docker_runner
  variables:
    CCACHE_DIR: $CI_PROJECT_DIR/.ccache
    NETGEN_INSTALL_DIR: $CI_PROJECT_DIR/install
  cache:
    key: ccache-linux
    paths:
      - .ccache
  before_script:
    - ccache -M 5G
    - ccache -s
    - export PYTHONPATH=$NETGEN_INSTALL_DIR/`python3 -c "import os.path, sysconfig;print(os.path.relpath(sysconfig.get_path('platlib'), sysconfig.get_path('data')))"`
    - export NETGENDIR=$NETGEN_INSTALL_DIR/bin
    - export PATH=$NETGENDIR:$PATH

linux_mpi:
  extends: .template_ubuntu
  stage: build
  needs: ["build_image"]
  script:
    - git submodule update --init --recursive
    - mkdir -p build/netgen
    - cd build/netgen
    - >-
      cmake $CI_PROJECT_DIR
      -DCMAKE_INSTALL_PREFIX=$NETGEN_INSTALL_DIR
      -DCHECK_RANGE=ON
      -DUSE_CCACHE=ON
      -DUSE_MPI=ON
      -DUSE_OCC=OFF
      -DENABLE_UNIT_TESTS=ON
    - make -j12
    - make install
    - ccache -s
    - make test_netgen ARGS="-V --output-on-failure"
  artifacts:
    paths:
      - install
    expire_in: 1 day

test_build_ngsolve:
  extends: .template_ubuntu
  stage: build
  when: manual
  script:
    - git clone https://github.com/NGSolve/ngsolve.git $CI_PROJECT_DIR/ngsolve_src
    - mkdir -p build/ngsolve
    - cd build/ngsolve
    - >-
      cmake $CI_PROJECT_DIR/ngsolve_src
      -DCHECK_RANGE=ON
      -DUSE_MKL=OFF
      -DUSE_CCACHE=ON
      -DNETGEN_DIR=$NETGEN_INSTALL_DIR
      -DCMAKE_BUILD_TYPE=DEBUG
    - make -j12
    - make install

############################################
# MacOSX
############################################
.template_mac:
  stage: build
  tags:
    - macosx
    - m1
  before_script:
    - export PATH=/Library/Frameworks/Python.framework/Versions/3.14/bin:$PATH
    - export CCACHE_BASEDIR=$CI_PROJECT_DIR
    - export CCACHE_NOHASHDIR=1
    - ccache -s
    - export BUILD_DIR=$CI_PROJECT_DIR/build
    - export CMAKE_INSTALL_PREFIX=$CI_PROJECT_DIR/netgen_install
    - export PYTHONPATH=$CMAKE_INSTALL_PREFIX/Contents/Resources/`python3 -c "import os.path, sysconfig;print(os.path.relpath(sysconfig.get_path('platlib'), sysconfig.get_path('data')))"`:.
    - export PATH=$CMAKE_INSTALL_PREFIX/Contents/MacOS:$PATH
    - mkdir -p $CMAKE_INSTALL_PREFIX

mac:
  extends: .template_mac
  script:
    - python3 -m pip install -U netgen-occt netgen-occt-devel cmake pytest-check
    - git submodule update --init --recursive
    - mkdir -p $BUILD_DIR
    - cd $BUILD_DIR
    - >-
        cmake $CI_PROJECT_DIR
        -DCMAKE_INSTALL_PREFIX=$CMAKE_INSTALL_PREFIX
        -DCMAKE_BUILD_TYPE=Release
        -DCHECK_RANGE=ON
        -DUSE_NATIVE_ARCH=ON
        -DUSE_CCACHE=ON
        -DENABLE_UNIT_TESTS=ON
        -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
        -DCMAKE_OSX_SYSROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
        -DUSE_CGNS=OFF
        -DPython3_ROOT_DIR=/Library/Frameworks/Python.framework/Versions/3.14
        -DUSE_OCC=ON
    - make -j5 install
    - cd $BUILD_DIR/netgen
    - ctest . -V --output-on-failure

############################################
# pip packages
############################################
pip_linux:
  image: cerbsim/manylinux_2_28_x86_64_cuda_12.9
  stage: pip
  tags:
    - pip
    - linux
  when: manual
  script:
    - ./tests/build_pip.sh

pip_windows:
  stage: pip
  tags:
    - pip
    - windows
  when: manual
  script:
    # cibuildwheel builds all supported CPython versions (see pyproject.toml)
    - .\tests\build_pip.ps1

pip_macos:
  stage: pip
  tags:
    - pip
    - macosx
    - m1
  when: manual
  script:
    # cibuildwheel builds all supported CPython versions (see pyproject.toml)
    - ./tests/build_pip_mac.sh
